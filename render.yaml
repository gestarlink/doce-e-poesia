services:
  - type: web
    name: negociatrader-collector
    runtime: python
    plan: free
    rootDir: connector
    buildCommand: pip install -r requirements.txt
    startCommand: python collector_service.py
    healthCheckPath: /health
    envVars:
      - key: IQ_ACCOUNT_KIND
        value: NOT_CONFIRMED
      - key: IQ_ASSET
        value: EURJPY-OTC
      - key: FEED_API_URL
        value: https://doceepoesia.pages.dev
